  <!-- Golden Sprout Leaf -->
  <path d="M44 14 C44 14 36 18 36 26 C36 30 39.5 33 44 33 C48.5 33 52 30 52 26 C52 18 44 14 44 14 Z" fill="#facc15" />
  <path d="M44 16 V33" stroke="#15803d" stroke-width="1.5" stroke-linecap="round" />
