<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="kisanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#kisanGrad)" />
  <circle cx="32" cy="32" r="29" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Tractor / Leaf Agriculture Motif -->
  <g fill="#ffffff">
