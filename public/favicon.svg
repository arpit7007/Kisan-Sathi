    <circle cx="22" cy="40" r="9" fill="#ffffff" />
    <circle cx="22" cy="40" r="5" fill="#15803d" />
    
    <!-- Front Small Wheel -->
    <circle cx="44" cy="42" r="5.5" fill="#ffffff" />
    <circle cx="44" cy="42" r="2.5" fill="#15803d" />
    
